def repos = {
  maven {url "${rootDir}/../../repo/6.1.1/releases"}
  maven {url "${rootDir}/../../repo/6.1.1/snapshots"}
  mavenCentral();

  maven {
    url 'https://plugins.gradle.org/m2/'
  }
}

ext.repos = repos

repositories repos
buildscript.repositories repos

allprojects {
  repositories repos
  buildscript.repositories repos
}
